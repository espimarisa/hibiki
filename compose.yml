services:
  hibiki:
    container_name: hibiki
    restart: unless-stopped
    depends_on: [postgres, valkey]
    networks: [hibiki-network]
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - hibiki-logs:/usr/src/app/logs

  postgres:
    container_name: postgres
    image: postgres:alpine
    restart: unless-stopped
    networks: [hibiki-network]
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
    volumes:
      - hibiki-postgres:/var/lib/postgresql/data

  valkey:
    container_name: valkey
    image: valkey/valkey:alpine
    restart: unless-stopped
    networks: [hibiki-network]
    ports:
      - ${VALKEY_PORT:-6379}:6379
    volumes:
      - hibiki-valkey:/data
    command: >
      valkey-server
      --requirepass ${VALKEY_PASSWORD}
      --appendonly yes
      --save ""
      --io-threads 4
      --io-threads-do-reads yes
      --rename-command FLUSHDB ""
      --rename-command FLUSHALL ""
      --rename-command CONFIG ""

networks:
  hibiki-network:
    driver: bridge
    external: true
    name: hibiki-network

volumes:
  hibiki-logs:
    external: true
    name: hibiki-logs

  hibiki-postgres:
    external: true
    name: hibiki-postgres

  hibiki-valkey:
    external: true
    name: hibiki-valkey
